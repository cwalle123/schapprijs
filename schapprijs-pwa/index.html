<style>
/* Layout: grocery-app shell — compact sticky header with a pill search, a three-store comparison band, a two-column product grid with square tiles, and a bottom tab bar. */
:root {
  /* One bright light theme in the style of a Dutch supermarket app: white surfaces, sky-blue chrome, store colours kept distinct. */
  --bg: #f1f5f9;
  --surface: #ffffff;
  --ink: #16222f;
  --muted: #5b6878;
  --line: #e0e7ee;
  --accent: #0a7fc2;
  --accent-deep: #075d90;
  --accent-soft: #e2f1fa;
  --on-accent: #ffffff;
  --good: #14873f;
  --good-soft: #e3f5e9;
  --warn-soft: #fff4d1;
  --tile: #f2f6fa;
  --ah: #0077c8;
  --jumbo: #ffcf00; --on-jumbo: #1b1b1b;
  --dirk: #e1251b;
  --lidl: #0b2a6f; --plus: #00857a; --dekamarkt: #f07c00; --hoogvliet: #6b3fa0; --spar: #7a4a1e; --vomar: #c2185b; --poiesz: #3d5a80; --aldi: #1c3d8c; --ekoplaza: #4f7d2c;
  --f-display: "Bricolage Grotesque", "Segoe UI", Roboto, sans-serif;
  --f-body: "Figtree", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "Roboto Mono", monospace;
  color-scheme: light;
}
/* Dark is opt-in from Settings (or "match my phone"), never forced by the viewer. */
:root[data-scheme="dark"] {
  --bg: #0f1620; --surface: #18222e; --ink: #e8eef5; --muted: #9aa8b8; --line: #2a3644;
  --accent: #1673b0; --accent-deep: #8ccbf2; --accent-soft: #16324a; --good: #3cc06d; --good-soft: #163a24;
  --warn-soft: #3a3217; --tile: #1f2b38; --lidl: #3d63c4; --spar: #a8723e; --poiesz: #6688b8; --aldi: #4a6fc9;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-scheme="system"] {
    --bg: #0f1620; --surface: #18222e; --ink: #e8eef5; --muted: #9aa8b8; --line: #2a3644;
    --accent: #1673b0; --accent-deep: #8ccbf2; --accent-soft: #16324a; --good: #3cc06d; --good-soft: #163a24;
    --warn-soft: #3a3217; --tile: #1f2b38; --lidl: #3d63c4; --spar: #a8723e; --poiesz: #6688b8; --aldi: #4a6fc9;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--accent); }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--accent); color: var(--on-accent); }
header .lang { background: rgb(255 255 255 / 0.16); border-color: transparent; }
header .lang button { color: var(--on-accent); }
header .lang button[aria-pressed="true"] { background: var(--surface); color: var(--accent-deep); }
header .chip { border-color: transparent; background: rgb(255 255 255 / 0.16); color: var(--on-accent); }
header .rchip { flex: none; display: inline-flex; align-items: stretch; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; overflow: hidden; }
.rchip button { border: 0; background: none; color: var(--ink); font: 500 0.88rem var(--f-body); cursor: pointer; }
.rchip .rq { padding: 7px 4px 7px 13px; }
.rchip .rx { padding: 0 11px 0 7px; color: var(--muted); font-size: 1.05rem; }
.rchip .rx:hover, .rchip .rx:focus-visible { color: var(--dirk); }
.chip[aria-pressed="true"] { background: var(--surface); color: var(--accent-deep); border-color: var(--surface); }
header :focus-visible { outline-color: var(--surface) !important; }
header .wrap { padding-block: 10px 12px; display: grid; gap: 10px; }
.topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 1.45rem; letter-spacing: -0.02em; margin: 0; }
.brand { color: var(--on-accent); } .brand span { color: var(--jumbo); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.lang button { border: 0; background: none; color: var(--muted); font: 600 0.78rem var(--f-body); letter-spacing: 0.06em; padding: 5px 11px; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.search { position: relative; }
.search input { width: 100%; font: 500 1.02rem var(--f-body); color: var(--ink); background: var(--surface); border: 1.5px solid transparent; border-radius: 999px; padding: 13px 44px 13px 44px; outline: none; -webkit-appearance: none; }
.search input:focus { border-color: var(--jumbo); }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); font-size: 1.3rem; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 0.85rem var(--f-body); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main .wrap { padding-block: 16px 40px; display: grid; gap: 18px; }
.note { background: var(--warn-soft); border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; }
.note button { border: 0; background: none; padding: 0; font: 600 0.92rem var(--f-body); color: var(--accent); text-decoration: underline; cursor: pointer; }
.label { font: 600 0.72rem var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }

.compare { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cell { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.cell.win { border: 2px solid var(--good); padding: 9px; background: var(--good-soft); }
.cell .store { font: 700 0.8rem var(--f-body); }
.cell .big { font: 800 1.35rem var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; line-height: 1.1; }
.cell .per { font: 500 0.72rem var(--f-data); color: var(--muted); }
.cell .what { font-size: 0.78rem; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.cell .badge { justify-self: start; background: var(--good); color: var(--surface); font: 700 0.66rem var(--f-body); letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; }
.cell .none { font-size: 0.85rem; color: var(--muted); }
.fine { font-size: 0.8rem; color: var(--muted); margin: 6px 0 0; }

.bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.count { font-size: 0.88rem; color: var(--muted); }
select { font: 500 0.88rem var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }

.list { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; color: inherit; text-decoration: none; }
.row:active { transform: scale(0.995); }
.row .name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.row .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--muted); }
.row .price { grid-row: 1 / span 2; grid-column: 2; text-align: right; display: grid; align-content: center; gap: 2px; }
.row .price b { font: 800 1.25rem var(--f-display); font-variant-numeric: tabular-nums; }
.row .price small { font: 500 0.72rem var(--f-data); color: var(--muted); white-space: nowrap; }
.tag { font: 700 0.7rem var(--f-body); padding: 2px 7px; border-radius: 6px; letter-spacing: 0.02em; }
.t-ah, .store.s-ah { color: #fff; background: var(--ah); }
.t-jumbo, .store.s-jumbo { color: var(--on-jumbo); background: var(--jumbo); }
.t-dirk, .store.s-dirk { color: #fff; background: var(--dirk); }
.t-lidl, .store.s-lidl { color: #fff; background: var(--lidl); }
.t-plus, .store.s-plus { color: #fff; background: var(--plus); }
.t-dekamarkt, .store.s-dekamarkt { color: #1b1b1b; background: var(--dekamarkt); }
.t-hoogvliet, .store.s-hoogvliet { color: #fff; background: var(--hoogvliet); }
.t-spar, .store.s-spar { color: #fff; background: var(--spar); }
.t-vomar, .store.s-vomar { color: #fff; background: var(--vomar); }
.t-poiesz, .store.s-poiesz { color: #fff; background: var(--poiesz); }
.t-aldi, .store.s-aldi { color: #fff; background: var(--aldi); }
.t-ekoplaza, .store.s-ekoplaza { color: #fff; background: var(--ekoplaza); }
.cell .store { justify-self: start; padding: 2px 8px; border-radius: 6px; font-size: 0.74rem; }
.low { color: var(--good); font-weight: 600; }
.more { justify-self: center; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 0.9rem var(--f-body); padding: 10px 18px; border-radius: 10px; cursor: pointer; }

.empty, .loading { text-align: center; color: var(--muted); padding: 30px 10px; }
.skel { height: 64px; border-radius: 12px; background: linear-gradient(90deg, var(--surface), var(--line), var(--surface)); background-size: 200% 100%; animation: sh 1.2s infinite linear; }
@keyframes sh { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }


.addform { display: flex; gap: 8px; }
.addform input { flex: 1; min-width: 0; font: 500 1.05rem var(--f-body); color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none; }
.addform input:focus { border-color: var(--accent); }
.btn { border: 0; background: var(--accent); color: var(--on-accent); font: 700 0.95rem var(--f-body); padding: 0 18px; border-radius: 12px; cursor: pointer; }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); padding: 8px 14px; font-weight: 600; font-size: 0.85rem; border-radius: 10px; }
.btn.danger { background: var(--dirk); color: #fff; border-color: transparent; }
.groc { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.gi { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 4px; padding: 4px 4px 4px 12px; border-top: 1px solid var(--line); }
.gi:first-child { border-top: 0; }
.gi label { display: flex; align-items: center; gap: 12px; min-width: 0; padding-block: 8px; cursor: pointer; grid-column: 1 / span 2; }
.gi input[type="checkbox"] { flex: none; width: 24px; height: 24px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.gi .txt { font-size: 1rem; font-weight: 500; overflow-wrap: anywhere; }
.gi.done .txt { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.icon { border: 0; background: none; color: var(--muted); width: 40px; height: 40px; border-radius: 10px; cursor: pointer; display: grid; place-items: center; font-size: 1.25rem; }
.icon svg { width: 18px; height: 18px; }
.icon:active { background: var(--bg); }
.gi .sub { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 0 8px 8px 36px; font-size: 0.86rem; color: var(--muted); }
.gi .lp b { color: var(--ink); font-variant-numeric: tabular-nums; }
.qty { margin-left: auto; display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.qty button { border: 0; background: var(--surface); color: var(--accent-deep); font: 700 1.05rem var(--f-body); width: 34px; height: 30px; cursor: pointer; }
.qty button:disabled { color: var(--line); cursor: default; }
.qty span { min-width: 22px; text-align: center; font: 600 0.9rem var(--f-body); color: var(--ink); font-variant-numeric: tabular-nums; }
.gi .tip { grid-column: 1 / -1; margin: 0 8px 10px 36px; background: var(--good-soft); border-radius: 10px; padding: 9px 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.gi .tip p { margin: 0; flex: 1 1 200px; min-width: 0; font-size: 0.85rem; color: var(--ink); overflow-wrap: anywhere; }
.btn.small { background: var(--good); padding: 7px 14px; font-size: 0.85rem; border-radius: 999px; }
.total { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.total span { font-weight: 600; }
.total b { font: 800 1.4rem var(--f-display); font-variant-numeric: tabular-nums; }
.total p { flex-basis: 100%; margin: 0; font-size: 0.8rem; color: var(--muted); }
.addbtn .q { font: 800 0.95rem var(--f-body); }
.sgroup { display: grid; gap: 6px; }
.sgroup + .sgroup { margin-top: 14px; }
.shead { display: flex; align-items: center; gap: 8px; }
.shead .tag { font-size: 0.8rem; padding: 3px 9px; }
.shead b { margin-left: auto; font: 800 1.05rem var(--f-display); font-variant-numeric: tabular-nums; }
.nostore { font: 600 0.8rem var(--f-body); color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
.card h2 { font: 700 1.05rem var(--f-display); margin: 0; }
.card p { margin: 0; }
.pform { display: grid; gap: 6px; }
.pform label { font: 600 0.8rem var(--f-body); color: var(--muted); }
.pform input { font: 500 1rem var(--f-body); color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.pform input:focus { border-color: var(--accent); outline: none; }
.pform .actions { margin-top: 6px; }
.acct { display: flex; align-items: center; gap: 12px; min-width: 0; }
.acct img { width: 52px; height: 52px; border-radius: 999px; flex: none; object-fit: cover; }
.acct .who { min-width: 0; display: grid; gap: 2px; }
.acct .who b { font-size: 1.05rem; overflow-wrap: anywhere; }
.acct .who span { color: var(--muted); font-size: 0.86rem; overflow-wrap: anywhere; }
.opts { display: grid; }
.opt { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-top: 1px solid var(--line); cursor: pointer; min-width: 0; }
.opt:first-child { border-top: 0; }
.opt input { flex: none; width: 22px; height: 22px; margin: 0; accent-color: var(--accent); }
.opt .grow { flex: 1; min-width: 0; display: grid; gap: 1px; }
.opt .grow small { color: var(--muted); font-size: 0.8rem; }
.opt.off { cursor: default; opacity: 0.55; }
.opt .tag { flex: none; min-width: 64px; text-align: center; }
.card ol { margin: 0; padding-left: 20px; font-size: 0.9rem; }
.card a { color: var(--accent-deep); }
.lcards { display: grid; gap: 8px; }
.lcard { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 4px 4px 0; }
.lopen { border: 0; background: none; color: inherit; text-align: left; font: inherit; padding: 12px 8px 12px 14px; display: grid; gap: 3px; cursor: pointer; min-width: 0; }
.lrow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.lcount { flex: none; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px; background: var(--dirk); color: #fff; font: 700 0.78rem var(--f-body); display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.lcount.zero { background: var(--line); color: var(--muted); }
.lname { font: 700 1.08rem var(--f-display); overflow-wrap: anywhere; }
.lmeta { font-size: 0.85rem; color: var(--muted); }
.lmeta b { color: var(--ink); font-variant-numeric: tabular-nums; }
.pill { justify-self: start; margin-top: 3px; font: 600 0.72rem var(--f-body); color: var(--accent-deep); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; }
.lacts { display: flex; align-items: center; }
.icon.warn { width: auto; padding: 0 10px; background: var(--dirk); color: #fff; }
.really { font: 600 0.75rem var(--f-body); white-space: nowrap; }
.lcard .renameform { padding: 8px 8px 8px 12px; }
.renameform { display: flex; gap: 8px; min-width: 0; flex: 1; }
.renameform input { flex: 1; min-width: 0; font: 600 1rem var(--f-body); color: var(--ink); background: var(--surface); border: 1.5px solid var(--accent); border-radius: 10px; padding: 8px 10px; }
.renameform .btn { padding: 0 14px; border-radius: 10px; }
.lhead { display: grid; gap: 6px; }
.back { justify-self: start; border: 0; background: none; color: var(--accent-deep); font: 600 0.95rem var(--f-body); padding: 4px 0; cursor: pointer; }
.ltitle { display: flex; align-items: center; gap: 4px; min-width: 0; }
.ltitle h2 { font: 800 1.5rem var(--f-display); letter-spacing: -0.01em; margin: 0; overflow-wrap: anywhere; min-width: 0; }
#listView { display: grid; gap: 16px; }
#listView[hidden] { display: none; }
.sheet-bg { position: fixed; inset: 0; z-index: 20; background: rgb(10 20 30 / 0.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 520px; max-height: 80vh; overflow-y: auto; background: var(--surface); border-radius: 18px 18px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; }
.sheet h2 { font: 800 1.2rem var(--f-display); margin: 0; }
.sheet-prod { margin: 0; color: var(--muted); font-size: 0.88rem; overflow-wrap: anywhere; }
.sheet-lists { display: grid; gap: 8px; }
.pick { display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 12px 14px; font: inherit; cursor: pointer; }
.pick .grow { flex: 1; min-width: 0; display: grid; gap: 2px; }
.pick b { font-weight: 700; overflow-wrap: anywhere; }
.pick small { color: var(--muted); }
.pick .plus { flex: none; width: 32px; height: 32px; border-radius: 999px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.pick .plus svg { width: 18px; height: 18px; }
.sheet .btn.ghost { justify-self: stretch; padding: 12px; font-size: 0.95rem; }
.drop { position: absolute; top: 8px; right: 8px; background: var(--dirk); color: #fff; font: 800 0.78rem var(--f-body); padding: 3px 7px; border-radius: 6px; }
.tile .was { font: 500 0.75rem var(--f-body); color: var(--muted); }
.tile .was s { text-decoration-thickness: 1.5px; }
.dropchip { font: 700 0.74rem var(--f-body); color: #fff; background: var(--dirk); padding: 2px 7px; border-radius: 6px; }
.tempchip { font: 600 0.74rem var(--f-body); color: var(--accent-deep); background: var(--accent-soft); padding: 2px 7px; border-radius: 6px; }
.linkbtn { border: 0; background: none; color: var(--accent-deep); font: 600 0.8rem var(--f-body); padding: 2px 0; cursor: pointer; text-decoration: underline; }
.hist { grid-column: 1 / -1; margin: 0 8px 10px 36px; background: var(--tile); border-radius: 10px; padding: 10px; display: grid; gap: 6px; min-width: 0; }
.hist svg { width: 100%; height: 76px; display: block; }

    ["cheese", /(kaas\b|\bkaas|kazen|zaanlander|\b\d\d\+|belegen|gouda|brie\b|mozzarella|\bfeta\b|parmez|camembert|cheddar|geitenkaas|mascarpone|ricotta)/],
    ["dairy", /(melk|yoghurt|kwark|pudding|protein|alpro|\bvla\b|room|boter|margarine|skyr|halvarine|zuivel|creme fraiche)/],
    ["eggs", /(\beieren|\bei\b|scharrelei)/],
    ["bread", /(brood|bolletjes|broodjes|croissant|beschuit|\bwrap|tortilla|pistolet|krentenbol|bagel|ontbijtkoek|pita|naan)/],
    ["cereal", /(muesli|cruesli|havermout|cornflakes|granola|ontbijtgranen|brinta)/],
    ["meat", /(\bkip|gehakt|\brund|varken|worst|ham\b|\bspek|haas|kotelet|rollade|entrecote|steak|lams|riblap|draadjesvlees|pate\b|salame|tempeh|tofu|filet|schnitzel|burger|salami|kalkoen|biefstuk|\bvlees|shoarma|speklap|karbonade|chorizo|gyros|slavink|bacon|vegetarisch|vegan)/],
    ["fish", /(\bvis\b|vissticks|zalm|tonijn|garnal|kabeljauw|haring|makreel|sardine|pangasius|mosselen|kibbeling|lekkerbek|surimi|ansjovis)/],
    ["drink", /(\bcola|frisdrank|limonade|\bsap\b|sapje|\bsap |water|sinas|fanta|sprite|energy|ice ?tea|ranja|siroop|smoothie|7up|tonic|spa\b|chaudfontaine|redbull|red bull|appelsap|sinaasappelsap)/],
    ["fruit", /(\bappel|banaan|bananen|sinaasappel|\bpeer|peren|aardbei|druif|druiven|mango|ananas|kiwi|citroen|framboz|blauwe bes|bessen|meloen|mandarijn|nectarine|perzik|pruim|kers|fruit|limoen|granaatappel|avocado)/],
    ["veg", /(groente|tomaat|tomaten|komkommer|\bsla\b|ijsbergsla|wortel|\bui\b|uien|paprika|broccoli|spinazie|aardappel|krieltjes|bospeen|champignon|courgette|prei|knoflook|bloemkool|boontjes|sperzie|aubergine|spruit|rucola|andijvie|kool\b|bonen|erwt|mais\b|maïs)/],
    ["grain", /(pasta|spaghetti|penne|macaroni|fusilli|rijst|noedel|mie\b|couscous|lasagne|tagliatelle|bloem\b|meel|quinoa|bulgur)/],
    ["meal", /(pizza|maaltijd|soep|verspakket|burrito|ovenschotel|stamppot|nasi|bami|salade|quiche)/],
    ["sauce", /(saus|ketchup|mayonaise|mosterd|olie|azijn|bouillon|kruiden|\bpeper|zout|dressing|pesto|sambal|ketjap|curry|marinade|suiker)/],
  ];
  const catCache = new Map();
  function category(name) {
    let c = catCache.get(name);
    if (c !== undefined) return c;
    const n = " " + name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "") + " ";
    c = null;
    for (const [k, re] of CATS) if (re.test(n)) { c = k; break; }
    catCache.set(name, c);
    return c;
  }
  const svg = (inner, label) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
  function thumbInner(name) {
    const c = category(name);
    return c ? svg(ICONS[c]) : `<span class="noimg">${svg(NOIMG)}<span>${t().noImage}</span></span>`;
  }
  const plusIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  const checkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

  const $ = s => document.querySelector(s);
  const out = $("#out"), qEl = $("#q"), clearBtn = $("#clear"), chipsEl = $("#storeChips");
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  let lang = store.get("sp-lang", "en");
  let storeFilter = "all";
  let sortMode = "best";
  let compareMode = store.get("sp-compare", "unit");
  let shown = 40;
  let DB = null; // { items: [...], vocab, vocabStr, updated }
  let lastQuery = "";

  const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
  const t = () => T[lang];
  const fmtMoney = n => "€ " + n.toFixed(2).replace(".", lang === "nl" ? "," : ".");
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function editDistance(a, b, max) {
    if (Math.abs(a.length - b.length) > max) return max + 1;
    let prev2 = null, prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      let rowMin = i;
      for (let j = 1; j <= b.length; j++) {
        let v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        if (prev2 && i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) v = Math.min(v, prev2[j - 2] + 1);
        cur.push(v);
        if (v < rowMin) rowMin = v;
      }
      if (rowMin > max) return max + 1;
      prev2 = prev; prev = cur;
    }
    return prev[b.length];
  }
  const maxDist = w => (w.length <= 4 ? 1 : 2);

  function buildIndex(raw) {
    const items = [];
    const counts = new Map();
    for (const s of STORES) {
      const block = raw.stores[s.key];  // only the ticked stores' files are loaded
      if (!block) continue;
      for (const [name, link, price, size, unitPrice, unit] of block.items) {
        const n = norm(name);
        const words = n.split(" ");
        items.push({ store: s.key, name, n, words, link: block.base + link, price, size, unitPrice, unit });
        for (const w of words) if (w.length >= 3 && !/^\d+$/.test(w)) counts.set(w, (counts.get(w) || 0) + 1);
      }
    }
    const vocab = [...counts.entries()];
    const byLink = new Map(items.map(it => [it.link, it]));
    return { items, byLink, vocab, vocabStr: "|" + vocab.map(v => v[0]).join("|") + "|", updated: raw.updated };
  }

  // Turn the typed text into search terms; each term may have an English alternative.
  function parseQuery(q) {
    let n = norm(q);
    for (const [en, nl] of Object.entries(PHRASES)) if ((" " + n + " ").includes(" " + en + " ")) n = (" " + n + " ").replace(" " + en + " ", " " + nl + " ").trim();
    return n.split(" ").filter(Boolean).map(tok => {
      const alts = [{ s: tok, prefix: false }];
      if (WORDS[tok]) { alts[0].prefix = true; alts.push({ s: WORDS[tok], prefix: false }); }
      return { tok, alts };
    });
  }
  const known = tok => DB.vocabStr.includes(tok) || /^\d+$/.test(tok) || WORDS[tok];

  function correctToken(tok) {
    if (tok.length < 3 || known(tok)) return null;
    const max = maxDist(tok);
    let best = null;
    for (const key of Object.keys(WORDS)) {
      const d = editDistance(tok, key, max);
      if (d <= max && (!best || d < best.d)) best = { w: key, d, c: 1e9 };
    }
    for (const [w, c] of DB.vocab) {
      let d = editDistance(tok, w, max);
      if (w.length > tok.length + 1) d = Math.min(d, editDistance(tok, w.slice(0, tok.length), 1) + 0.5);
      if (d <= max && (!best || d < best.d || (d === best.d && c > best.c))) best = { w, d, c };
    }
    return best ? best.w : null;
  }

  function fuzzyWords(tok) {
    const set = new Set();
    if (tok.length < 4) return set;
    const max = maxDist(tok);
    for (const [w] of DB.vocab) {
      if (w === tok) continue;
      let d = editDistance(tok, w, max);
      if (d > max && w.length > tok.length) d = editDistance(tok, w.slice(0, tok.length), 1);
      if (d <= max) set.add(w);
    }
    return set;
  }

  function scoreExact(item, terms) {
    let score = 0;
    for (const term of terms) {
      let best = -1;
      for (const a of term.alts) {
        if (a.prefix) {
          if (item.words.some(w => w.startsWith(a.s))) best = Math.max(best, 3);
        } else if (item.n.includes(a.s)) {
          let s = 1;
          if (item.words.includes(a.s)) s = 5;
          else if (item.words.some(w => w.startsWith(a.s))) s = 3;
          best = Math.max(best, s);
        }
      }
      if (best < 0) return -1;
      score += best;
    }
    return score - item.n.length * 0.02;
  }

  function search(q) {
    const terms = parseQuery(q);
    if (!terms.length) return null;
    let main = [];
    for (const it of DB.items) { const s = scoreExact(it, terms); if (s >= 0) main.push({ it, s }); }

    // Spelling suggestion for words that do not occur in any product name.
    let corrected = null;
    const fixed = terms.map(term => correctToken(term.tok) || term.tok);
    if (fixed.some((w, i) => w !== terms[i].tok)) corrected = fixed.join(" ");

    let usedCorrection = false;
    if (!main.length && corrected) {
      const t2 = parseQuery(corrected);
      for (const it of DB.items) { const s = scoreExact(it, t2); if (s >= 0) main.push({ it, s }); }
      usedCorrection = main.length > 0;
    }

    // Similar names: products where a word is a close spelling of a typed word.
    const inMain = new Set(main.map(m => m.it));
    const fuzzy = terms.map(term => fuzzyWords(term.tok));
    const similar = [];
    if (fuzzy.some(s => s.size)) {
      for (const it of DB.items) {
        if (inMain.has(it)) continue;
        let ok = true, hits = 0;
        for (let i = 0; i < terms.length; i++) {
          const term = terms[i];
          const direct = term.alts.some(a => a.prefix ? it.words.some(w => w.startsWith(a.s)) : it.n.includes(a.s));
          if (direct) continue;
          if (it.words.some(w => fuzzy[i].has(w))) { hits++; continue; }
          ok = false; break;
        }
        if (ok && hits) similar.push({ it, s: -it.n.length * 0.02 });
      }
      similar.sort((a, b) => b.s - a.s);
    }
    main.sort((a, b) => b.s - a.s);
    // The comparison uses only the best-matching tier (e.g. "melk" as a word, not "melkchocolade").
    const base = m => Math.round(m.s + m.it.n.length * 0.02);
    let top = main.length ? base(main[0]) : 0;
    let core = main.filter(m => base(m) >= top);
    if (new Set(core.map(m => m.it.store)).size < 2) core = main.filter(m => base(m) >= top - 2);
    return { main: main.map(m => m.it), core: core.map(m => m.it), similar: similar.slice(0, 30).map(m => m.it), corrected, usedCorrection };
  }

  function compareBlock(items, q) {
    if (!items.length) return "";
    const words = parseQuery(q).flatMap(term => term.alts.map(a => a.s));
    if (words.some(w => LIQUID.has(w))) {
      const liquids = items.filter(it => it.unit === "l");
      if (liquids.length) items = liquids;
    }
    const unitCount = {};
    // Pick the unit (kg, litre, piece) from the closest matches, which are listed first.
    const head = items.slice(0, 30);
    for (const it of head) if (it.unit) unitCount[it.unit] = (unitCount[it.unit] || 0) + 1;
    const unit = Object.keys(unitCount).sort((a, b) => unitCount[b] - unitCount[a])[0];
    const useUnit = compareMode === "unit" && unit && unitCount[unit] >= head.length * 0.5;
    const per = {};
    for (const s of STORES) {
      let best = null;
      for (const it of items) {
        if (it.store !== s.key) continue;
        if (useUnit) { if (it.unit !== unit || it.unitPrice == null) continue; if (!best || it.unitPrice < best.unitPrice) best = it; }
        else if (!best || it.price < best.price) best = it;
      }
      if (!best && useUnit) {
        for (const it of items) if (it.store === s.key && (!best || it.price < best.price)) best = it;
        if (best) best = { ...best, noUnit: true };
      }
      per[s.key] = best;
    }
    const val = it => (useUnit && !it.noUnit ? it.unitPrice : it.price);
    const winners = STORES.map(s => per[s.key]).filter(it => it && !it.noUnit);
    const winVal = winners.length ? Math.min(...winners.map(val)) : null;
    const cells = STORES.map(s => {
      const it = per[s.key];
      if (!it) return `<div class="cell"><span class="store s-${s.key}">${s.name}</span><span class="none">${t().noMatch}</span></div>`;
      const win = winners.length > 1 && val(it) === winVal;
      return `<a class="cell${win ? " win" : ""}" href="${esc(it.link)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">
        <span class="store s-${s.key}">${s.name}</span>
        <span class="big">${fmtMoney(val(it))}</span>
        <span class="per">${useUnit && !it.noUnit ? t().unitShort[unit] : esc(it.size || "")}</span>
        <span class="what">${esc(it.name)}</span>
        ${win ? `<span class="badge">${t().cheapest}</span>` : ""}
      </a>`;
    }).join("");
    return `<section><div class="bar" style="margin-bottom:8px"><p class="label" style="margin:0">${useUnit ? t().cheapestPer(t().units[unit]) : t().cheapestPrice}</p>
      <div class="lang" role="group" aria-label="Compare by">
        <button type="button" id="cmp-unit" data-cmp="unit" aria-pressed="${compareMode === "unit"}">${t().cmpUnit}</button>
        <button type="button" id="cmp-pack" data-cmp="pack" aria-pressed="${compareMode === "pack"}">${t().cmpPack}</button>
      </div></div>
      <div class="compare" style="grid-template-columns:repeat(${Math.min(STORES.length, 3)},minmax(0,1fr))">${cells}</div><p class="fine">${t().compareNote}</p></section>`;
  }

  function rowHtml(it, lowest, showSpark) {
    const deal = dealsByLink.get(it.link);
    const s = ALL_STORES.find(x => x.key === it.store);
    const pcs = (it.name.match(/(\d+)\s*(?:stuks|stuk|st)\b/i) || [])[1];
    const sizeText = [it.size, pcs && !/st/i.test(it.size || "") ? `${pcs} ${lang === "nl" ? "stuks" : "pieces"}` : ""].filter(Boolean).join(" · ");
    const unitLine = it.unitPrice != null && it.unit ? `${fmtMoney(it.unitPrice)}${t().unitShort[it.unit]}` : "";
    const on = onList(it.link);
    return `<div class="tile">
      <a href="${esc(it.link)}" target="_blank" rel="noopener">
        <span class="thumb">${thumbInner(it.name)}<span class="tag t-${it.store}">${s.short}</span>${deal ? `<span class="drop">−${deal.d}%</span>` : ""}</span>
        <span class="body">
          <span class="p${lowest ? " low" : ""}">${fmtMoney(it.price)}</span>
          ${deal ? `<span class="was">${t().usually(`<s>${fmtMoney(deal.u / 100)}</s>`)}</span>` : ""}
          ${unitLine ? `<span class="u">${unitLine}</span>` : ""}
          <span class="nm">${esc(it.name)}</span>
          ${sizeText ? `<span class="sz">${esc(sizeText)}</span>` : ""}
          ${deal && showSpark ? sparkSvg(deal.h, deal.u, "spark") : ""}
        </span>
      </a>
      <button type="button" class="addbtn${on ? " on" : ""}" data-add="${esc(it.link)}" aria-label="${esc(on ? t().inLists(on) + ": " + it.name : t().addToList(it.name))}">${on ? `<span class="q">${on}</span>` : plusIcon}</button>
    </div>`;
  }

  function sorted(list) {
    const l = storeFilter === "all" ? list.slice() : list.filter(i => i.store === storeFilter);
    if (sortMode === "price") l.sort((a, b) => a.price - b.price);
    if (sortMode === "unit") l.sort((a, b) => (a.unitPrice ?? 1e9) - (b.unitPrice ?? 1e9));
    return l;
  }

  // A recent search: tap the text to search again, tap × to forget it.
  const recentChips = (list, qAttr, rmAttr) => `<div class="chips" style="flex-wrap:wrap">${list.map(r => `<span class="rchip"><button type="button" class="rq" ${qAttr}="${esc(r)}">${esc(r)}</button><button type="button" class="rx" ${rmAttr}="${esc(r)}" aria-label="${esc(t().removeRecent(r))}">×</button></span>`).join("")}</div>`;
  function rememberIn(key, q) {
    q = q.trim();
    if (q.length < 2) return;
    const recent = store.get(key, []).filter(x => x.toLowerCase() !== q.toLowerCase());
    recent.unshift(q);
    store.set(key, recent.slice(0, 8));
  }
  const forgetIn = (key, q) => store.set(key, store.get(key, []).filter(x => x !== q));

  // Recent searches only show while the search bar is focused and empty; otherwise the home view shows products.
  let qFocused = false, dqFocused = false;
  function startScreen() {
    const recent = store.get("sp-recent", []);
    if (qFocused) return recent.length ? `<section class="recentpanel"><p class="label">${t().recent}</p>${recentChips(recent, "data-q", "data-rmq")}</section>` : `<p class="empty">${t().start}</p>`;
    let html = `<p class="empty" style="padding-bottom:6px">${t().start}</p>`;
    const top = [...dealsByLink.entries()].map(([link, d]) => ({ it: DB.byLink.get(link), d })).filter(x => x.it).sort((a, b) => b.d.d - a.d.d).slice(0, 8);
    if (top.length) html += `<section><div class="bar" style="margin-bottom:10px"><p class="label" style="margin:0">${t().topDrops}</p><button type="button" class="linkbtn" id="seeDrops">${t().seeAllDrops}</button></div>
      <div class="grid">${top.map(x => rowHtml(x.it, true, false)).join("")}</div></section>`;
    return html;
  }

  const dataDate = () => { try { return new Date(storeIndex.updated).toLocaleDateString(lang === "nl" ? "nl-NL" : "en-GB", { day: "numeric", month: "long", year: "numeric" }); } catch { return ""; } };
  function footer() {
    let d = dataDate();
    return `<section class="help"><p style="margin:0">${t().source} ${d ? t().updated(d) + "." : ""}</p></section>`;
  }

  function render() {
    if (!DB) return;
    const q = qEl.value.trim();
    clearBtn.hidden = !q;
    if (!q) { out.innerHTML = startScreen() + footer(); return; }
    const r = search(q);
    if (!r) { out.innerHTML = startScreen() + footer(); return; }
    let html = "";
    if (r.usedCorrection) html += `<p class="note">${t().showingFor(esc(q), esc(r.corrected))}</p>`;
    else if (r.corrected) html += `<p class="note">${t().didYouMean} <button type="button" data-q="${esc(r.corrected)}">${esc(r.corrected)}</button>?</p>`;

    if (!r.main.length && !r.similar.length) {
      out.innerHTML = html + `<p class="empty">${t().nothing(esc(q))}</p>` + footer();
      return;
    }
    const compareSource = r.main.length ? r.core : r.similar;
    html += compareBlock(compareSource.slice(0, 300), r.usedCorrection ? r.corrected : q);

    const list = sorted(r.main);
    if (r.main.length) {
      const minPrice = Math.min(...list.map(i => i.price));
      html += `<section><div class="bar"><span class="count">${t().results(list.length)}</span>
        <select id="sort" aria-label="Sort">
          <option value="best"${sortMode === "best" ? " selected" : ""}>${t().sortBest}</option>
          <option value="price"${sortMode === "price" ? " selected" : ""}>${t().sortPrice}</option>
          <option value="unit"${sortMode === "unit" ? " selected" : ""}>${t().sortUnit}</option>
        </select></div>
        <div class="grid" style="margin-top:10px">${list.slice(0, shown).map(i => rowHtml(i, i.price === minPrice)).join("")}</div>
        ${list.length > shown ? `<div style="display:grid;margin-top:10px"><button type="button" class="more" id="more">${t().more}</button></div>` : ""}
      </section>`;
    }
    const sim = sorted(r.similar);
    if (sim.length) {
      html += `<section><p class="label">${t().similar}</p><p class="fine" style="margin:-4px 0 8px">${t().similarNote}</p>
        <div class="grid">${sim.slice(0, 15).map(i => rowHtml(i, false)).join("")}</div></section>`;
    }
    out.innerHTML = html + footer();
  }

  // ---- Grocery list: kept on this phone and, when signed in, in the viewer's private store ----
  let tab = store.get("sp-tab", "compare");
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  // Several named lists; `groceries` is always the items of the active (last opened) list.
  const newList = name => ({ id: uid(), name: name || "", items: [], created: Date.now() });
  let lists = store.get("sp-lists", null);
  if (!Array.isArray(lists) || !lists.length) { lists = [newList("")]; lists[0].items = store.get("sp-list", []); }
  let activeId = store.get("sp-active", lists[0].id);
  let listOpen = store.get("sp-listopen", false);
  let renamingId = null, confirmDelId = null;
  const active = () => lists.find(l => l.id === activeId) || lists[0];
  const listName = l => (l.name || "").trim() || t().defaultList;
  let groceries = active().items;
  function useLists(next) {
    lists = Array.isArray(next) && next.length ? next.map(l => ({ ...l, items: (l.items || []).map(g => ({ ...g })) })) : [newList("")];
    if (!lists.some(l => l.id === activeId)) activeId = lists[0].id;
    groceries = active().items;
  }
  function openList(id) {
    active().items = groceries;
    activeId = id; groceries = active().items; listOpen = true; confirmClear = false;
    store.set("sp-active", activeId); store.set("sp-listopen", true);
    tipCache.clear(); renderList(); updateTabs(); window.scrollTo(0, 0);
  }
  let cloud = null; // { ref } when the private store is available
  let phoneOnly = false; // signed in, but this viewer may not save to their account here
  let saveError = false;
  let confirmClear = false;
  const listBody = $("#listBody"), listView = $("#listView"), addInput = $("#addInput"), listHead = $("#listHead");

  let saveTimer = null, saving = Promise.resolve();
  let lastLocal = 0;
  function persist() {
    lastLocal = Date.now();
    active().items = groceries;
    store.set("sp-lists", lists); store.set("sp-active", activeId);
    if (!cloud) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const body = { lists: lists.map(l => ({ ...l, items: l.items.map(g => ({ ...g })) })), settings: { ...settings, stores: settings.stores.slice() }, savedAt: Date.now() };
      saving = saving.then(() => cloud.ref.set(body)).then(() => {
        if (saveError) { saveError = false; renderList(); }
      }).catch(err => {
        const code = err && err.code;
        if (code === "invalid_argument" || code === "not_granted" || code === "revoked" || code === "capability_disabled") {
          cloud = null; phoneOnly = true; renderList(); renderSettings(); // no save access: this phone keeps the data
        } else { saveError = true; renderList(); }
      });
    }, 400);
  }

  function applyRemoteSettings(rs) {
    if (!rs || typeof rs !== "object") return;
    const storesChanged = Array.isArray(rs.stores) && rs.stores.join() !== settings.stores.join();
    if (Array.isArray(rs.stores) && rs.stores.length) settings.stores = rs.stores.filter(k => ALL_STORES.some(s => s.key === k));
    if (["light", "dark", "system"].includes(rs.theme)) settings.theme = rs.theme;
    if (typeof rs.motion === "boolean") settings.motion = rs.motion;
    if (rs.profile && typeof rs.profile === "object") settings.profile = { name: String(rs.profile.name || "").slice(0, 60), email: String(rs.profile.email || "").slice(0, 120) };
    if (rs.lang === "en" || rs.lang === "nl") { settings.lang = rs.lang; if (rs.lang !== lang) { lang = rs.lang; store.set("sp-lang", lang); applyLang(); } }
    store.set("sp-settings", settings);
    applyTheme();
    if (storesChanged && storeIndex.updated) loadPrices().catch(() => {});
    renderSettings();
  }

  async function connectCloud() {
    try {
      const claude = window.claude;
      if (!claude || !claude.use) return;
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db || !user) return;
      try {
        viewer = await user.me(); renderSettings();
        if (obDraft && !obEl.hidden && !obDraft.name && viewer.name) { obDraft.name = viewer.name; if (obStep === 1) renderOnboarding(); }
      } catch {}
      const id = await user.id();
      if (!id) return;
      const ref = db.doc(`data/users/${id}/grocery`);
      const snap = await ref.get();
      cloud = { ref };
      const data = snap.exists ? snap.data() : {};
      if (Array.isArray(data.lists) && data.lists.length) { useLists(data.lists); store.set("sp-lists", lists); }
      else if (Array.isArray(data.items)) { const l = newList(""); l.items = data.items; useLists([l]); persist(); } // older single list
      else if (groceries.length) persist(); // first time: move this phone's lists into the account
      applyRemoteSettings(snap.exists ? snap.data().settings : null);
      renderList(); updateTabs();
      ref.onSnapshot(s => {
        if (s.metadata.hasPendingWrites || !s.exists || Date.now() - lastLocal < 3000) return;
        const remoteLists = s.data().lists;
        if (!Array.isArray(remoteLists)) return;
        active().items = groceries;
        if (JSON.stringify(remoteLists) === JSON.stringify(lists)) return;
        useLists(remoteLists); store.set("sp-lists", lists);
        applyRemoteSettings(s.data().settings);
        renderList(); updateTabs();
      }, () => {});
    } catch { cloud = null; }
  }

  function addItems(text) {
    const parts = text.split(/[,;\n]+/).map(x => x.trim()).filter(Boolean);
    let added = false;
    for (const p of parts) {
      const existing = groceries.find(g => !g.product && g.text.toLowerCase() === p.toLowerCase());
      if (existing) {
        if (existing.done) { existing.done = false; existing.qty = 1; } else existing.qty = (existing.qty || 1) + 1;
        groceries = [existing, ...groceries.filter(g => g !== existing)];
      }
      else groceries.unshift({ id: uid(), text: p.slice(0, 120), done: false, added: Date.now(), qty: 1 });
      added = true;
    }
    if (added) { confirmClear = false; persist(); renderList(); updateTabs(); }
  }

  const searchIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>`;
  function listIcon(text) {
    let c = category(text);
    if (!c) {
      const nl = parseQuery(text).map(term => term.alts[term.alts.length - 1].s).join(" ");
      c = category(nl) || category(nl.replace(/\bbanan\b/, "bananen").replace(/\btoma\b/, "tomaten"));
    }
    return svg(c ? ICONS[c] : NOIMG);
  }
  // How many of this product are still to get (0 when it is not on the list).
  const onList = link => {
    active().items = groceries;
    return lists.reduce((a, l) => a + l.items.filter(x => x.product && x.product.link === link && !x.done).reduce((b, x) => b + (x.qty || 1), 0), 0);
  };

  function addProduct(it, listId) {
    active().items = groceries;
    const target = lists.find(l => l.id === listId) || active();
    const existing = target.items.find(g => g.product && g.product.link === it.link);
    let qty = 1;
    if (existing) {
      if (existing.done) { existing.done = false; existing.qty = 1; } else existing.qty = (existing.qty || 1) + 1;
      qty = existing.qty;
    } else {
      target.items.unshift({ id: uid(), text: it.name, done: false, added: Date.now(), qty: 1,
        product: { name: it.name, price: it.price, size: it.size || "", store: it.store, link: it.link } });
    }
    groceries = active().items;
    confirmClear = false; persist(); renderList(); updateTabs();
    return qty;
  }

  // ---- "Add to which list?" sheet ----
  let sheetItem = null, sheetReturn = null;
  const sheet = $("#sheet");
  function openSheet(it, from) {
    sheetItem = it; sheetReturn = from || null;
    active().items = groceries;
    const L = t();
    $("#sheetTitle").textContent = L.pickList;
    $("#sheetProd").textContent = `${it.name} · ${storeName(it.store)} · ${fmtMoney(it.price)}`;
    $("#sheetLists").innerHTML = lists.map(l => {
      const have = l.items.filter(g => g.product && g.product.link === it.link && !g.done).reduce((a, g) => a + (g.qty || 1), 0);
      const left = l.items.filter(g => !g.done).length;
      return `<button type="button" class="pick" data-pick="${esc(l.id)}"><span class="grow"><b>${esc(listName(l))}</b><small>${have ? L.alreadyOn(have) : L.itemsLeft(left)}</small></span><span class="plus">${plusIcon}</span></button>`;
    }).join("");
    $("#sheetNewInput").value = "";
    $("#sheetNewInput").placeholder = L.newListPh2;
    $("#sheetNewInput").setAttribute("aria-label", L.newListPh2);
    $("#sheetNewBtn").textContent = L.newListBtn;
    $("#sheetCancel").textContent = L.cancel;
    sheet.hidden = false;
    const first = sheet.querySelector(".pick"); if (first) first.focus();
  }
  function closeSheet() { sheet.hidden = true; sheetItem = null; if (sheetReturn && sheetReturn.focus) sheetReturn.focus(); sheetReturn = null; }
  function addFromSheet(listId) {
    const it = sheetItem; if (!it) return;
    const q = addProduct(it, listId);
    const n = listName(lists.find(l => l.id === listId) || active());
    closeSheet();
    toast(q > 1 ? t().addedToN(n, q) : t().addedTo(n));
    render(); renderDeals();
  }
  sheet.addEventListener("click", e => {
    if (e.target === sheet || e.target.id === "sheetCancel") { closeSheet(); return; }
    const pk = e.target.closest("[data-pick]"); if (pk) addFromSheet(pk.dataset.pick);
  });
  $("#sheetNew").addEventListener("submit", e => {
    e.preventDefault();
    const l = newList(($("#sheetNewInput").value || "").trim().slice(0, 60));
    active().items = groceries; lists.push(l); persist(); renderList();
    addFromSheet(l.id);
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !sheet.hidden) closeSheet(); });

  // Package contents: a piece count when the pack states one, otherwise its weight or volume.
  const MEAS = { g: ["kg", 0.001], gr: ["kg", 0.001], gram: ["kg", 0.001], grm: ["kg", 0.001], kg: ["kg", 1], kilo: ["kg", 1],
    ml: ["l", 0.001], mililiters: ["l", 0.001], milliliter: ["l", 0.001], cl: ["l", 0.01], l: ["l", 1], liter: ["l", 1], ltr: ["l", 1] };
  const UNIT_RE = "(kg|kilo|gram|grm|gr|g|mililiters|milliliter|ml|cl|liter|ltr|l)";
  const MULTI_RE = new RegExp("(\\d+(?:[.,]\\d+)?)\\s*x\\s*(\\d+(?:[.,]\\d+)?)\\s*" + UNIT_RE + "\\b", "i");
  const SINGLE_RE = new RegExp("(\\d+(?:[.,]\\d+)?)\\s*" + UNIT_RE + "\\b", "i");
  const PCS_RE = /(\d+)\s*(?:stuks|stuk|st)\b/i;
  const num = x => parseFloat(x.replace(",", "."));
  function measure(text) {
    if (!text) return null;
    let m = text.match(MULTI_RE);
    if (m) { const [k, f] = MEAS[m[3].toLowerCase()]; return { kind: k, q: num(m[1]) * num(m[2]) * f }; }
    m = text.match(SINGLE_RE);
    if (m) { const [k, f] = MEAS[m[2].toLowerCase()]; return { kind: k, q: num(m[1]) * f }; }
    return null;
  }
  function amountOf(p) {
    // "2-pack" sold as "2 stuks" means two packs, not two pieces, so the contents are unknown.
    if (/\d+\s*-?\s*pack\b/i.test(p.name) && !PCS_RE.test(p.name)) return null;
    const m = (p.size || "").match(PCS_RE) || p.name.match(PCS_RE);
    if (m && +m[1] > 0) return { kind: "pcs", q: +m[1] };
    if (/\bper stuk\b/i.test(p.size || "")) return { kind: "pcs", q: 1 };
    const a = measure(p.size) || measure(p.name);
    return a && a.q > 0 ? a : null;
  }

  // Words that say nothing about what the product is (store brands, packaging, filler).
  const FILLER = new Set(["ah", "albert", "heijn", "jumbo", "dirk", "daily", "chef", "beste", "excellent", "basic", "gwoon", "huismerk",
    "de", "het", "een", "en", "van", "voor", "met", "in", "op", "naturel", "origineel", "original", "classic", "regular", "stuks", "stuk", "st",
    "pak", "zak", "fles", "blik", "pot", "doos", "multipack", "voordeelverpakking", "familiepak", "voordeel", "vriesvers", "kant", "klaar",
    "per", "pakket", "x", "g", "gr", "gram", "kg", "ml", "cl", "l", "liter", "pack", "xl", "mini", "groot", "grote", "klein", "kleine", "verse", "vers"]);
  // Words that make it a different product, so a cheaper option may not add them.
  const DIFFERENT = new Set(["mix", "volkoren", "meergranen", "glutenvrij", "lactosevrij", "suikervrij", "light", "zero", "vegan", "vegetarisch",
    "bio", "biologisch", "spek", "kaneel", "halfvolle", "volle", "magere", "ongezouten", "gezouten", "pittig", "mild", "protein", "proteine",
    "schudfles", "spekplakjes", "houdbare", "lactosevrije", "lactofree", "langlekker", "melkdrank", "drinkyoghurt", "kaas", "ham", "kip", "chocolade", "vanille", "aardbei", "banaan"]);
  const keyWords = name => norm(name).split(" ").filter(w => w.length >= 2 && !/^\d/.test(w) && !FILLER.has(w));
  const sameWord = (a, b) => a === b || (a.length >= 5 && b.length >= 5 && Math.abs(a.length - b.length) <= 2 && (a.startsWith(b) || b.startsWith(a)));

  const tipCache = new Map();
  function cheaperOption(g) {
    if (!DB || !g.product || g.done) return null;
    const base = DB.byLink.get(g.product.link) || g.product;
    const qty = g.qty || 1;
    const key = base.link + "|" + qty;
    if (tipCache.has(key)) return tipCache.get(key);
    let best = null;
    const amt = amountOf(base), keys = keyWords(base.name);
    if (amt && keys.length) {
      const need = amt.q * qty, current = base.price * qty, cat = category(base.name);
      const first = keys.reduce((a, b) => (b.length > a.length ? b : a));
      for (const c of DB.items) {
        if (c.link === base.link || !c.n.includes(first.slice(0, 5))) continue;
        const ck = keyWords(c.name);
        if (!keys.every(k => ck.some(w => sameWord(k, w)))) continue;
        const extra = ck.filter(w => !keys.some(k => sameWord(k, w)));
        if (extra.length > 1 || extra.some(w => DIFFERENT.has(w))) continue;
        if (cat && category(c.name) !== cat) continue;
        const a = amountOf(c);
        if (!a || a.kind !== amt.kind) continue;
        const m = Math.round(need / a.q);
        if (m < 1 || m > 8 || Math.abs(m * a.q - need) > need * 0.005) continue;
        const cost = Math.round(m * c.price * 100) / 100;
        if (cost <= current - 0.05 && (!best || cost < best.cost)) best = { c, m, cost, save: current - cost, current, deal: dealsByLink.get(c.link) || null };
      }
    }
    tipCache.set(key, best);
    return best;
  }
  const storeName = k => (ALL_STORES.find(s => s.key === k) || {}).name || k;
  let toastTimer;
  function toast(msg) {
    const el = $("#toast"); el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 1800);
  }

  const histOpen = new Set();
  const histData = {}; // item id -> {vals} once loaded
  function histHtml(g) {
    const h = histData[g.id];
    if (!h) return `<p class="fine" style="margin:0">…</p>`;
    if (!h.vals || h.vals.filter(Boolean).length < 2) return `<p class="fine" style="margin:0">${t().histNone}</p>`;
    const vs = h.vals.filter(Boolean), sorted = vs.slice().sort((a, b) => a - b);
    const usual = sorted[Math.floor(sorted.length / 2)];
    return `${sparkSvg(h.vals, usual, "hchart")}
      <div class="hl"><span>${t().histNow} <b>${fmtMoney(vs[vs.length - 1] / 100)}</b></span><span>${t().histUsual} <b>${fmtMoney(usual / 100)}</b></span>
      <span>${t().histLow} <b>${fmtMoney(sorted[0] / 100)}</b></span><span>${t().histHigh} <b>${fmtMoney(sorted[sorted.length - 1] / 100)}</b></span></div>`;
  }
  async function toggleHistory(id) {
    if (histOpen.has(id)) { histOpen.delete(id); renderList(); return; }
    histOpen.add(id); renderList();
    const g = groceries.find(x => x.id === id);
    if (!g || !g.product) return;
    const h = await loadHistory(g.product.store);
    const rel = relLink(g.product.link, g.product.store);
    histData[id] = { vals: h && rel != null ? h.p[rel] || null : null };
    renderList();
  }
  const livePrice = g => (g.product ? ((DB && DB.byLink.get(g.product.link)) || g.product).price : null);
  function itemHtml(g) {
    const qty = g.qty || 1;
    const price = livePrice(g);
    let priceText = "";
    if (price != null) priceText = qty > 1 ? `${qty} × ${fmtMoney(price)} = <b>${fmtMoney(price * qty)}</b>` : `<b>${fmtMoney(price)}</b>`;
    const tip = cheaperOption(g);
    return `<div class="gi${g.done ? " done" : ""}">
      <label><input type="checkbox" id="chk-${esc(g.id)}" data-tick="${esc(g.id)}"${g.done ? " checked" : ""}><span class="ico">${listIcon(g.text)}</span><span class="txt">${esc(g.text)}</span></label>
      <button type="button" class="icon" data-find="${esc(g.id)}" aria-label="${t().compareItem}: ${esc(g.text)}" title="${t().compareItem}">${searchIcon}</button>
      <button type="button" class="icon" data-del="${esc(g.id)}" aria-label="${t().removeItem}: ${esc(g.text)}" title="${t().removeItem}">×</button>
      <div class="sub">
        ${g.product ? `<span class="tag t-${g.product.store}">${(ALL_STORES.find(s => s.key === g.product.store) || {}).short || ""}</span>` : ""}
        ${priceText ? `<span class="lp">${priceText}</span>` : ""}
        ${g.product && dealsByLink.has(g.product.link) ? `<span class="dropchip">${t().dropFor(dealsByLink.get(g.product.link).d, fmtMoney(dealsByLink.get(g.product.link).u / 100))}</span>` : ""}
        ${g.product && loaded[g.product.store] ? `<button type="button" class="linkbtn" data-hist="${esc(g.id)}" aria-expanded="${histOpen.has(g.id)}">${histOpen.has(g.id) ? t().hideHistory : t().history}</button>` : ""}
        <span class="qty">
          <button type="button" data-dec="${esc(g.id)}" aria-label="${t().qtyLess}"${qty <= 1 ? " disabled" : ""}>−</button>
          <span aria-live="polite">${qty}</span>
          <button type="button" data-inc="${esc(g.id)}" aria-label="${t().qtyMore}">+</button>
        </span>
      </div>
      ${g.temp ? `<div class="temp-note"><span class="tempchip">${t().tempNote}</span><button type="button" class="linkbtn" data-revert="${esc(g.id)}">${t().switchBack}</button></div>` : ""}
      ${histOpen.has(g.id) ? `<div class="hist" id="hist-${esc(g.id)}">${histHtml(g)}</div>` : ""}
      ${tip ? `<div class="tip"><p>${(tip.deal ? t().cheaperDeal : t().cheaper)(tip.m, esc(tip.c.name), storeName(tip.c.store), fmtMoney(tip.cost), fmtMoney(tip.current), fmtMoney(tip.save))}</p>
        <button type="button" class="btn small" data-switch="${esc(g.id)}">${t().switchTo}</button></div>` : ""}
    </div>`;
  }

  let listSort = store.get("sp-listsort", "added");
  function sortItems(items, how) {
    const l = items.slice();
    if (how === "az") l.sort((a, b) => a.text.localeCompare(b.text, lang === "nl" ? "nl" : "en", { sensitivity: "base" }));
    if (how === "price") l.sort((a, b) => ((livePrice(b) ?? -1) * (b.qty || 1)) - ((livePrice(a) ?? -1) * (a.qty || 1)));
    return l; // "added": newest first, as stored
  }

  const pencil = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>';
  const trash = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
  const renameForm = l => `<form class="renameform" data-rename-form="${esc(l.id)}"><input id="rn-${esc(l.id)}" type="text" value="${esc(l.name || "")}" placeholder="${esc(t().defaultList)}" maxlength="60" aria-label="${t().rename}"><button type="submit" class="btn">${t().save}</button></form>`;

  function renderOverview() {
    const L = t();
    listHead.innerHTML = "";
    $("#addForm").hidden = true;
    const cards = lists.map(l => {
      const todo = l.items.filter(g => !g.done), done = l.items.length - todo.length;
      const sum = todo.reduce((a, g) => a + (livePrice(g) ?? 0) * (g.qty || 1), 0);
      const openQty = todo.reduce((a, g) => a + (g.qty || 1), 0);
      const name = renamingId === l.id ? renameForm(l) : `<span class="lrow"><b class="lname">${esc(listName(l))}</b><span class="lcount${openQty ? "" : " zero"}" aria-label="${L.openItems(openQty)}">${openQty}</span></span>`;
      return `<div class="lcard">
        ${renamingId === l.id ? name : `<button type="button" class="lopen" data-open="${esc(l.id)}">${name}
          <span class="lmeta">${L.listMeta(openQty, done)}${sum ? ` · <b>${fmtMoney(sum)}</b>` : ""}</span></button>`}
        <div class="lacts">
          <button type="button" class="icon" data-rename="${esc(l.id)}" aria-label="${L.rename}: ${esc(listName(l))}" title="${L.rename}">${pencil}</button>
          <button type="button" class="icon${confirmDelId === l.id ? " warn" : ""}" data-ldel="${esc(l.id)}" aria-label="${confirmDelId === l.id ? L.confirmDelete : L.deleteList}: ${esc(listName(l))}" title="${L.deleteList}">${confirmDelId === l.id ? `<span class="really">${L.confirmDelete}</span>` : trash}</button>
        </div>
      </div>`;
    }).join("");
    listBody.innerHTML = `<section><p class="label">${L.myLists} · ${lists.length}</p><div class="lcards">${cards}</div></section>
      <form class="addform" id="newListForm" autocomplete="off"><input id="newListInput" type="text" maxlength="60" placeholder="${esc(L.newListPh)}" aria-label="${esc(L.newListPh)}"><button type="submit" class="btn">${L.create}</button></form>
      ${saveError ? `<p class="note">${L.saveFail}</p>` : ""}
      <p class="saved">${cloud ? L.savedCloud : phoneOnly ? L.savedPhoneOnly : L.savedLocal}</p>`;
  }

  function renderList() {
    if (!listOpen) { renderOverview(); return; }
    const cur = active();
    $("#addForm").hidden = false;
    listHead.innerHTML = `<div class="lhead"><button type="button" class="back" id="backLists" aria-label="${t().backToLists}">‹ ${t().backToLists}</button>
      ${renamingId === cur.id ? renameForm(cur) : `<div class="ltitle"><h2>${esc(listName(cur))}</h2><button type="button" class="icon" data-rename="${esc(cur.id)}" aria-label="${t().rename}" title="${t().rename}">${pencil}</button></div>`}</div>`;
    addInput.placeholder = t().addPh;
    $("#addBtn").textContent = t().add;
    const todo = groceries.filter(g => !g.done), done = groceries.filter(g => g.done);
    let html = "";
    if (saveError) html += `<p class="note">${t().saveFail}</p>`;
    if (!groceries.length) html += `<p class="empty">${t().emptyList}</p>`;
    else {
      const priced = todo.filter(g => livePrice(g) != null);
      const unpriced = todo.length - priced.length;
      if (priced.length) {
        const sum = priced.reduce((a, g) => a + livePrice(g) * (g.qty || 1), 0);
        html += `<div class="total"><span>${t().total("")}</span><b>${fmtMoney(sum)}</b>${unpriced ? `<p>${t().noPrice(unpriced)}</p>` : ""}</div>`;
      }
      const sortSel = `<select id="listSort" aria-label="${t().sortList}">
        ${["added", "az", "store", "price"].map(k => `<option value="${k}"${listSort === k ? " selected" : ""}>${t().listSorts[k]}</option>`).join("")}
      </select>`;
      let todoHtml;
      if (!todo.length) todoHtml = `<p class="fine" style="margin:0">${t().allDone}</p>`;
      else if (listSort === "store") {
        todoHtml = [...ALL_STORES.map(s => s.key), null].map(k => {
          const items = sortItems(todo.filter(g => (g.product ? g.product.store : null) === k), "az");
          if (!items.length) return "";
          const sum = items.reduce((a, g) => a + (livePrice(g) ?? 0) * (g.qty || 1), 0);
          const head = k ? `<span class="tag t-${k}">${storeName(k)}</span>` : `<span class="nostore">${t().noStore}</span>`;
          return `<div class="sgroup"><div class="shead">${head}<span class="fine" style="margin:0">${items.length}</span>${k ? `<b>${fmtMoney(sum)}</b>` : ""}</div>

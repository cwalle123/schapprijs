    if (reduceMotion()) { resetDrag(el); hidePeek(sw); if (next && far) setTab(next, true); return; } // animations off: jump straight there
    if (next && far) {
      // carry on in the same direction: the current tab leaves, the next one settles in place
      if (!sw.peek) showPeek(sw, next);
      el.style.transition = ease; el.style.transform = `translateX(${dx < 0 ? -W : W}px)`; el.style.opacity = "0";
      if (sw.peek) { sw.peek.style.transition = ease; sw.peek.style.transform = "translateX(0)"; sw.peek.style.opacity = "1"; }
      setTimeout(() => { resetDrag(el); hidePeek(sw); setTab(next, true); }, 210);
      return;
    }
    // not far enough: spring back
    el.style.transition = ease; el.style.transform = "translateX(0)"; el.style.opacity = "1";
    if (sw.peek) { sw.peek.style.transition = ease; sw.peek.style.transform = `translateX(${dx < 0 ? W : -W}px)`; sw.peek.style.opacity = "0"; }
    setTimeout(() => { resetDrag(el); hidePeek(sw); }, 220);
  }
  document.addEventListener("touchend", endSwipe, { passive: true });
  document.addEventListener("touchcancel", endSwipe, { passive: true });

  document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.tab === "list" && tab === "list" && listOpen) { listOpen = false; renamingId = null; store.set("sp-listopen", false); renderList(); }
    setTab(b.dataset.tab);
  }));
  $("#addForm").addEventListener("submit", e => { e.preventDefault(); addItems(addInput.value); addInput.value = ""; addInput.focus(); });
  listBody.addEventListener("change", e => {
    if (e.target.id === "listSort") { listSort = e.target.value; store.set("sp-listsort", listSort); renderList(); return; }
    const id = e.target.dataset && e.target.dataset.tick; if (!id) return;
    const g = groceries.find(x => x.id === id); if (!g) return;
    g.done = e.target.checked; confirmClear = false; persist(); renderList(); updateTabs();
  });
  function handleListMeta(e) {
    const op = e.target.closest("[data-open]");
    if (op) { renamingId = null; confirmDelId = null; openList(op.dataset.open); return true; }
    if (e.target.closest("#backLists")) { listOpen = false; renamingId = null; store.set("sp-listopen", false); renderList(); window.scrollTo(0, 0); return true; }
    const rn = e.target.closest("[data-rename]");
    if (rn) { renamingId = rn.dataset.rename; confirmDelId = null; renderList(); const inp = $("#rn-" + renamingId); if (inp) { inp.focus(); inp.select(); } return true; }
    const dl = e.target.closest("[data-ldel]");
    if (dl) {
      const id = dl.dataset.ldel;
      if (confirmDelId !== id) { confirmDelId = id; renderList(); return true; }
      lists = lists.filter(l => l.id !== id); confirmDelId = null;
      if (!lists.length) lists = [newList("")];
      if (!lists.some(l => l.id === activeId)) activeId = lists[0].id;
      groceries = active().items; persist(); renderList(); updateTabs(); return true;
    }
    return false;
  }
  function handleListForms(e) {
    const f = e.target.closest("form"); if (!f) return;
    if (f.id === "newListForm") {
      e.preventDefault();
      const inp = $("#newListInput"); const l = newList((inp.value || "").trim().slice(0, 60));
      active().items = groceries; lists.push(l); persist(); openList(l.id); toast(t().listCreated(listName(l)));
    } else if (f.dataset.renameForm) {
      e.preventDefault();
      const l = lists.find(x => x.id === f.dataset.renameForm);
      const inp = f.querySelector("input");
      if (l && inp) { l.name = inp.value.trim().slice(0, 60); }
      renamingId = null; persist(); renderList();
    }
  }
  listHead.addEventListener("click", e => { handleListMeta(e); });
  listHead.addEventListener("submit", handleListForms);
  listBody.addEventListener("submit", handleListForms);
  listBody.addEventListener("click", e => {
    if (handleListMeta(e)) return;
    const inc = e.target.closest("[data-inc]"), dec = e.target.closest("[data-dec]");
    if (inc || dec) {
      const g = groceries.find(x => x.id === (inc || dec).dataset[inc ? "inc" : "dec"]);
      if (g) { g.qty = Math.max(1, (g.qty || 1) + (inc ? 1 : -1)); persist(); renderList(); updateTabs(); }
      return;
    }
    const hb = e.target.closest("[data-hist]");
    if (hb) { toggleHistory(hb.dataset.hist); return; }
    const rv = e.target.closest("[data-revert]");
    if (rv) {
      const g = groceries.find(x => x.id === rv.dataset.revert);
      if (g && g.temp) { g.text = g.temp.text; g.qty = g.temp.qty; g.product = g.temp.product; delete g.temp; persist(); renderList(); updateTabs(); toast(t().switchedBack); }
      return;
    }
    const sw = e.target.closest("[data-switch]");
    if (sw) {
      const g = groceries.find(x => x.id === sw.dataset.switch);
      const tip = g && cheaperOption(g);
      if (tip) {
        const twin = !tip.deal && groceries.find(x => x !== g && x.product && x.product.link === tip.c.link && !x.done);
        if (twin) { twin.qty = (twin.qty || 1) + tip.m; groceries = groceries.filter(x => x !== g); }
        else {
          if (tip.deal && !g.temp) g.temp = { text: g.text, qty: g.qty || 1, product: { ...g.product } };
          if (!tip.deal) delete g.temp;
          g.text = tip.c.name; g.qty = tip.m;
          g.product = { name: tip.c.name, price: tip.c.price, size: tip.c.size || "", store: tip.c.store, link: tip.c.link };
        }
        delete histData[g.id]; histOpen.delete(g.id);
        persist(); renderList(); updateTabs(); toast(t().switched);
      }
      return;
    }
    const del = e.target.closest("[data-del]");
    if (del) { groceries = groceries.filter(g => g.id !== del.dataset.del); persist(); renderList(); updateTabs(); return; }
    const find = e.target.closest("[data-find]");
    if (find) {
      const g = groceries.find(x => x.id === find.dataset.find);
      if (g) { qEl.value = g.text; shown = 40; setTab("compare"); render(); }
      return;
    }
    if (e.target.id === "untickAll") { groceries.forEach(g => (g.done = false)); confirmClear = false; persist(); renderList(); updateTabs(); return; }
    if (e.target.id === "removeTicked") {
      if (!confirmClear) { confirmClear = true; renderList(); return; }
      groceries = groceries.filter(g => !g.done); confirmClear = false; persist(); renderList(); updateTabs();
    }
  });

  function renderChips() {
    const opts = [{ key: "all", label: t().all }, ...STORES.map(s => ({ key: s.key, label: s.name }))];
    chipsEl.innerHTML = opts.map(o => `<button type="button" class="chip" data-store="${o.key}" aria-pressed="${storeFilter === o.key}">${o.label}</button>`).join("");
  }

  function applyLang() {
    document.documentElement.lang = lang;
    qEl.placeholder = t().placeholder;
    $("#lang-en").setAttribute("aria-pressed", lang === "en");
    $("#lang-nl").setAttribute("aria-pressed", lang === "nl");
    const lt = $("#loadingText"); if (lt) lt.textContent = t().loading;
    renderChips();
    render();
    renderList();
    renderSettings();
    renderDeals();
    updateTabs();
  }

  const remember = q => rememberIn("sp-recent", q);

  let timer;
  qEl.addEventListener("input", () => {
    shown = 40;
    clearTimeout(timer);
    timer = setTimeout(() => { render(); if (qEl.value.trim() !== lastQuery) { lastQuery = qEl.value.trim(); } }, 180);
  });
  qEl.addEventListener("focus", () => { qFocused = true; if (!qEl.value.trim()) render(); });
  qEl.addEventListener("blur", () => { qFocused = false; if (!qEl.value.trim()) render(); });
  dq.addEventListener("focus", () => { dqFocused = true; if (!dq.value.trim()) renderDeals(); });
  dq.addEventListener("blur", () => { dqFocused = false; if (!dq.value.trim()) renderDeals(); });
  // Tapping a recent search must not blur the box first, or the list would vanish before the tap lands.
  [out, dealsView].forEach(el => el.addEventListener("pointerdown", e => { if (e.target.closest(".rchip")) e.preventDefault(); }));
  // Android's back button: the first press only closes the keyboard and the page gets no event for it,
  // so watch the screen height grow back (keyboard gone) and leave the search box then.
  let minH = Infinity;
  const viewH = () => Math.max(window.innerHeight || 0, (window.visualViewport && window.visualViewport.height) || 0);
  function onViewResize() {
    if (!qFocused && !dqFocused) { minH = Infinity; return; }
    const h = viewH();
    if (h < minH) minH = h;
    else if (h > minH + 100) { minH = Infinity; if (document.activeElement) document.activeElement.blur(); }
  }
  window.addEventListener("resize", onViewResize);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", onViewResize);
  // Chrome on Android can also report the keyboard directly; when it reports the keyboard gone, leave the box.
  try {
    if (navigator.virtualKeyboard) navigator.virtualKeyboard.addEventListener("geometrychange", e => {
      const r = e.target && e.target.boundingRect;
      if (r && r.height === 0 && (qFocused || dqFocused) && document.activeElement) document.activeElement.blur();
    });
  } catch {}
  // If that signal never comes, the next back press closes the recent searches instead of leaving the app:
  // focusing a search box adds a history step, and going back from it just leaves the box.
  let searchStep = false, skipPop = false;
  function addSearchStep() { if (searchStep) return; try { history.pushState({ spSearch: 1 }, ""); searchStep = true; } catch {} }
  function dropSearchStep() { if (!searchStep) return; searchStep = false; skipPop = true; try { history.back(); } catch { skipPop = false; } }
  window.addEventListener("popstate", () => {
    if (skipPop) { skipPop = false; return; }
    if (searchStep) { searchStep = false; if (document.activeElement) document.activeElement.blur(); qFocused = dqFocused = false; render(); renderDeals(); }
  });
  [qEl, dq].forEach(el => {
    el.addEventListener("focus", () => { minH = viewH(); addSearchStep(); });
    el.addEventListener("blur", () => setTimeout(() => { if (!qFocused && !dqFocused) dropSearchStep(); }, 0));
  });
  qEl.addEventListener("keydown", e => { if (e.key === "Enter") { remember(qEl.value); qEl.blur(); } });
  qEl.addEventListener("change", () => remember(qEl.value));
  clearBtn.addEventListener("click", () => { qEl.value = ""; render(); qEl.focus(); });
  document.querySelectorAll(".topline .lang button").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; store.set("sp-lang", lang); settings.lang = lang; saveSettings(); applyLang(); }));
  chipsEl.addEventListener("click", e => {
    const b = e.target.closest("[data-store]"); if (!b) return;
    storeFilter = b.dataset.store; shown = 40; renderChips(); render();
  });
  out.addEventListener("click", e => {
    const ab = e.target.closest("[data-add]");
    if (ab) {
      const it = DB && DB.byLink.get(ab.dataset.add);
      if (it) openSheet(it, ab);
      return;
    }
    const rmq = e.target.closest("[data-rmq]");
    if (rmq) { forgetIn("sp-recent", rmq.dataset.rmq); render(); return; }
    if (e.target.id === "seeDrops") { setTab("deals"); return; }
    const qb = e.target.closest("[data-q]");
    if (qb) { qEl.value = qb.dataset.q; remember(qb.dataset.q); shown = 40; qEl.blur(); qFocused = false; render(); window.scrollTo(0, 0); return; }
    if (e.target.id === "more") { shown += 40; render(); }
    const cb = e.target.closest("[data-cmp]");
    if (cb) { compareMode = cb.dataset.cmp; store.set("sp-compare", compareMode); render(); return; }
    const row = e.target.closest("a.row, a.cell");
    if (row && qEl.value.trim()) remember(qEl.value);
  });
  out.addEventListener("change", e => { if (e.target.id === "sort") { sortMode = e.target.value; render(); } });

  // ---- First-time setup: a few welcome screens, then a short tour of the main buttons ----
  const obEl = $("#onboard"), obCard = $("#obCard");
  let obStep = 0, obDraft = null;
  const OB_STEPS = 4;
  const featIcons = [ICONS.drink, '<path d="M9 6h11M9 12h11M9 18h11"/><path d="m3 6 1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/>', '<path d="M3 7l6 6 4-4 8 8"/><path d="M15 17h6v-6"/>'];
  function startOnboarding() {
    obStep = 0;
    const prof = settings.profile || {};
    obDraft = { name: prof.name || (viewer && viewer.name) || "", email: prof.email || "", stores: settings.stores.slice(), theme: settings.theme || "light" };
    obEl.hidden = false; renderOnboarding();
  }
  function renderOnboarding() {
    const L = t();
    const dots = `<div class="ob-dots" aria-label="${L.obStep(obStep + 1, OB_STEPS)}">${Array.from({ length: OB_STEPS }, (_, i) => `<span class="${i === obStep ? "on" : ""}"></span>`).join("")}</div>`;
    const langSw = `<div class="lang" role="group" aria-label="${L.obLang}"><button type="button" data-oblang="en" aria-pressed="${lang === "en"}">EN</button><button type="button" data-oblang="nl" aria-pressed="${lang === "nl"}">NL</button></div>`;
    let body = "";
    if (obStep === 0) {
      body = `<h1 id="obTitle">${L.obWelcome} Schap<span>prijs</span></h1><p class="lead">${L.obLead}</p>
        <ul class="ob-feats">${L.obFeats.map((f, i) => `<li><span class="fi">${svg(featIcons[i])}</span><div><b>${f[0]}</b><span>${f[1]}</span></div></li>`).join("")}</ul>`;
    } else if (obStep === 1) {
      body = `<h2 id="obTitle">${L.obProfileTitle}</h2><p class="lead">${L.obProfileLead}</p>
        <div class="card pform"><label for="obName">${L.nameLabel}</label><input id="obName" type="text" maxlength="60" value="${esc(obDraft.name)}" placeholder="${esc(L.guest)}">
        <label for="obEmail">${L.emailLabel}</label><input id="obEmail" type="email" maxlength="120" value="${esc(obDraft.email)}" placeholder="name@example.com"></div>`;
    } else if (obStep === 2) {
      body = `<h2 id="obTitle">${L.obStoresTitle}</h2><p class="lead">${L.obStoresLead}</p>
        <div class="card"><div class="opts">${ALL_STORES.map(st => {
          const info = storeIndex.stores[st.key];
          const avail = !info || info.count > 0;
          const on = avail && obDraft.stores.includes(st.key);
          return `<label class="opt${avail ? "" : " off"}"><input type="checkbox" id="ob-st-${st.key}" data-obstore="${st.key}"${on ? " checked" : ""}${avail ? "" : " disabled"}>
            <span class="tag t-${st.key}">${st.short}</span><span class="grow"><span>${st.name}</span><small>${info ? (avail ? L.products(info.count) : L.noPrices) : ""}</small></span></label>`;
        }).join("")}</div></div>`;
    } else {
      body = `<h2 id="obTitle">${L.obLookTitle}</h2><p class="lead">${L.obLookLead}</p>
        <div class="card"><div class="opts">${[["light", L.themeLight], ["dark", L.themeDark], ["system", L.themeSystem]].map(([v, label]) => `<label class="opt"><input type="radio" name="obtheme" id="obtheme-${v}" data-obtheme="${v}"${obDraft.theme === v ? " checked" : ""}><span class="grow"><span>${label}</span></span></label>`).join("")}</div></div>`;
    }
    const last = obStep === OB_STEPS - 1;
    obCard.innerHTML = `<div class="ob-top">${dots}${langSw}</div>${body}
      <div class="ob-nav">${obStep ? `<button type="button" class="btn ghost" id="obBack">${L.obBack}</button>` : `<span></span>`}
        <button type="button" class="btn" id="obNext">${last ? L.obStart : L.obNext}</button></div>`;
    const first = obCard.querySelector("#obNext"); if (first && obStep === 0) first.focus();
  }
  function readObFields() {
    const n = $("#obName"), e = $("#obEmail");
    if (n) obDraft.name = n.value.trim().slice(0, 60);
    if (e) obDraft.email = e.value.trim().slice(0, 120);
  }
  function finishOnboarding(withTour) {
    readObFields();
    const claudeName = (viewer && viewer.name) || "";
    settings.profile = { name: obDraft.name && obDraft.name !== claudeName ? obDraft.name : "", email: obDraft.email };
    const storesChanged = obDraft.stores.join() !== settings.stores.join();
    settings.stores = obDraft.stores.length ? obDraft.stores : DEFAULT_STORES.slice();
    settings.theme = obDraft.theme; applyTheme();
    store.set("sp-onboarded", true); saveSettings();
    obEl.hidden = true;
    if (storesChanged) loadPrices().catch(() => {});
    renderSettings();
    if (withTour) { setTab("compare"); qEl.value = ""; render(); setTimeout(() => startTour(0), 350); }
  }
  obCard.addEventListener("click", e => {
    const id = e.target.id;
    const lb = e.target.closest("[data-oblang]");
    if (lb) { readObFields(); lang = lb.dataset.oblang; store.set("sp-lang", lang); settings.lang = lang; applyLang(); renderOnboarding(); return; }
    if (id === "obBack") { readObFields(); obStep = Math.max(0, obStep - 1); renderOnboarding(); return; }
    if (id === "obNext") {
      readObFields();
      if (obStep === 2 && !obDraft.stores.length) { toast(t().keepOne); return; }
      if (obStep < OB_STEPS - 1) { obStep++; renderOnboarding(); obEl.scrollTop = 0; } else finishOnboarding(true);
    }
  });
  obCard.addEventListener("change", e => {
    const d = e.target.dataset || {};
    if (d.obstore) obDraft.stores = ALL_STORES.map(x => x.key).filter(k => k === d.obstore ? e.target.checked : obDraft.stores.includes(k));
    if (d.obtheme) { obDraft.theme = d.obtheme; settings.theme = d.obtheme; applyTheme(); }
  });

  const tourHole = $("#tourHole"), tourTip = $("#tourTip"), tourBlock = $("#tourBlock");
  // Each step: which tab to show, and what to highlight there. Steps whose target is missing are skipped.
  const TOUR = [
    { tab: "compare", el: () => $("#q") },
    { tab: "compare", el: () => (STORES.length > 1 ? $("#storeChips") : null) },
    { tab: "compare", el: () => out.querySelector(".tile") },
    { tab: "deals", el: () => $("#tab-deals") },
    { tab: "deals", el: () => $("#dq") },
    { tab: "deals", el: () => dealsOut.querySelector(".tile") },
    { tab: "list", el: () => $("#tab-list") },
    { tab: "list", el: () => listBody.querySelector(".lcard") },
    { tab: "list", el: () => $("#newListForm") },
    { tab: null, el: () => $("#tab-settings") },
  ];
  let tourIdx = -1;
  function startTour(i) { tourIdx = i; tourBlock.hidden = false; showTourStep(1); }
  function endTour() {
    tourIdx = -1; tourHole.hidden = tourTip.hidden = tourBlock.hidden = true;
    setTab("compare");
    toast(t().tourFinished);
  }
  function showTourStep(dir) {
    let el = null, switched = false;
    while (tourIdx >= 0 && tourIdx < TOUR.length) {
      const st = TOUR[tourIdx];
      if (st.tab && st.tab !== tab) {
        if (st.tab === "list") { listOpen = false; renamingId = null; store.set("sp-listopen", false); renderList(); }
        setTab(st.tab); switched = true;
      }
      el = st.el();
      if (el) { const rr = el.getBoundingClientRect(); if (rr.width > 0 && rr.height > 0) break; }
      el = null; tourIdx += dir;
    }
    if (!el) { endTour(); return; }
    if (switched && !reduceMotion()) {
      tourHole.hidden = tourTip.hidden = true;
      const target = el, idx = tourIdx;
      setTimeout(() => { if (tourIdx === idx) placeTour(target); }, 300);
      return;
    }
    placeTour(el);
  }
  function placeTour(el) {
    const L = t();
    if (!el.closest("nav.bottom, header")) el.scrollIntoView({ block: "center" });
    const r = el.getBoundingClientRect(), pad = 6;
    tourHole.style.transition = reduceMotion() ? "none" : "";
    Object.assign(tourHole.style, { left: `${r.left - pad}px`, top: `${r.top - pad}px`, width: `${r.width + pad * 2}px`, height: `${r.height + pad * 2}px` });
    tourHole.hidden = false;
    const [title, text] = L.tour[tourIdx];
    const last = tourIdx === TOUR.length - 1;
    tourTip.innerHTML = `<h3>${title}</h3><p>${text}</p>
      <div class="tnav"><span class="grow">${L.tourOf(tourIdx + 1, TOUR.length)}</span>
        ${tourIdx ? `<button type="button" class="btn ghost" id="tourBack">${L.tourBack}</button>` : `<button type="button" class="btn ghost" id="tourSkip">${L.tourSkip}</button>`}
        <button type="button" class="btn" id="tourNext">${last ? L.tourDone : L.tourNext}</button></div>`;
    tourTip.hidden = false;
    const tipH = tourTip.offsetHeight, vh = window.innerHeight, vw = window.innerWidth;
    const below = r.bottom + pad + 12, above = r.top - pad - 12 - tipH;
    const top = below + tipH < vh - 8 ? below : Math.max(8, above);
    const left = Math.min(Math.max(12, r.left + r.width / 2 - tourTip.offsetWidth / 2), vw - tourTip.offsetWidth - 12);
    Object.assign(tourTip.style, { top: `${top}px`, left: `${left}px` });
    $("#tourNext").focus();
  }
  tourTip.addEventListener("click", e => {
    if (tourIdx < 0) return;
    if (e.target.id === "tourNext") { if (tourIdx >= TOUR.length - 1) { endTour(); return; } tourIdx++; showTourStep(1); }
    else if (e.target.id === "tourBack") { tourIdx = Math.max(0, tourIdx - 1); showTourStep(-1); }
    else if (e.target.id === "tourSkip") endTour();
  });
  window.addEventListener("resize", () => { if (tourIdx >= 0) showTourStep(1); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && tourIdx >= 0) endTour(); });

  applyTheme();
  applyLang();
  connectCloud();
  if (!store.get("sp-onboarded", false)) startOnboarding();
  qEl.value = ""; dq.value = ""; // always open with empty searches; recent searches stay one tap away
  loadPrices().catch(() => { out.innerHTML = `<p class="empty">${t().loadFail}</p>`; });
})();
</script>
<script>
  // Offline support and installability: register the service worker.
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>

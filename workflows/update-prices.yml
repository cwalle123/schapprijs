# Builds the price data every morning and publishes the app on GitHub Pages.
# The data is generated fresh on each run, so it is never committed and the repository stays small.
name: Update prices and publish

on:
  schedule:
    - cron: "45 5 * * *"   # 05:45 UTC = 07:45 Amsterdam summer time (06:45 in winter)
  push:
    branches: [main]
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Get the app
        uses: actions/checkout@v4

      - name: Get the open price data (with its daily history)
        run: git clone --filter=blob:none https://github.com/supermarkt/checkjebon.git "$RUNNER_TEMP/checkjebon"

      - name: Build price files, price history and price drops
        run: |
          mkdir -p site
          cp index.html manifest.webmanifest sw.js site/
          cp -r icons site/
          python3 -I scripts/build_data.py "$RUNNER_TEMP/checkjebon/data/supermarkets.json" site/data "$RUNNER_TEMP/checkjebon"
          test "$(ls site/data/prices-*.json | wc -l)" -ge 3

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
